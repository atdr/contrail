# Optional local convenience: `pre-commit install`. CI is the real gate.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # `ruff-check`, not `ruff`: the latter is a deprecated alias kept for
      # compatibility, running the identical `ruff check`. It will be removed
      # eventually, and the failure would land on an unrelated `rev` bump.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  # Markdown. CI runs these through atdr/github-boilerplate's markdown
  # workflow (checks.yml), so keep both in step with the versions it pins: a
  # hook that lints to a different version than CI is worse than no hook.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        # The `globs` in .markdownlint-cli2.yaml already cover every file, and
        # markdownlint-cli2 adds any filenames it is given to them rather than
        # replacing them — so passing the staged files just reports each of
        # them twice.
        pass_filenames: false

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        # All extensions, not core CommonMark. Without mdformat-gfm every
        # padded table in the repo is reflowed into unpadded pipes; without
        # mdformat-frontmatter a YAML block at the top of a file is rewritten
        # into a horizontal rule and a heading; the last two keep footnotes
        # and GitHub alerts intact. The same set, at the same pins, as
        # scripts/requirements-markdown.txt in atdr/github-boilerplate, which
        # is what CI installs.
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-frontmatter==2.2.0
          - mdformat-footnote==0.1.3
          - mdformat-gfm-alerts==2.1.0
        # .mdformat.toml sets `exclude`, which errors below 3.13. Pinning the
        # hook's own env means that holds whatever the developer's default
        # interpreter is.
        language_version: python3.13
        # No `exclude:` here on purpose. .mdformat.toml owns that list, and it
        # applies to the paths pre-commit passes as well as to a directory
        # walk, so a second copy here could only drift from it.

  # Passport's CSS and JS. Keep `rev` in step with the setup-biome `version` in
  # .github/workflows/ci.yml. biome-ci checks without writing, the same as CI;
  # run `biome check --write` by hand to apply fixes. Files outside biome.jsonc's
  # `files.includes` are skipped, so staged JSON elsewhere is not touched.
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.14
    hooks:
      - id: biome-ci
