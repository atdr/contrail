name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests share a group per branch, so a new push cancels the run it
# supersedes. Every other run gets a group of its own: GitHub keeps only one
# pending run per group and drops the older for a newer, even with
# cancel-in-progress false, so a shared group on main would leave commits
# with no result. Each commit on main keeps its own, so a red one points at
# the commit that broke it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ruff, the pytest matrix and the coverage report, from atdr/github-boilerplate.
  # Coverage there reports and never gates the same way it did here: the
  # Codecov upload is continue-on-error, and codecov.yml keeps its statuses
  # informational.
  python:
    uses: atdr/github-boilerplate/.github/workflows/python-ci.yml@v0.4.0
    with:
      # Every version requires-python in pyproject.toml admits.
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Catches a broken parser here, before it can reach anyone's production
  # instance through a version tag. Both importers, since they also have to
  # agree with each other about which flights are the same one. Needs no
  # secrets: --dry-run never calls the emissions API, and both importers accept
  # a local path. Every supported version, like the pytest matrix, since a
  # parser can break on one interpreter alone.
  dry-run:
    name: dry-run ${{ matrix.python-version }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Dry-run against the fixture sources
        env:
          TRIPIT_ICAL_URL: tests/fixtures/sample_feed.ics
          FLIGHTY_CSV_PATH: tests/fixtures/sample_flighty.csv
        run: contrail sync --dry-run --csv-path "${RUNNER_TEMP}/should-not-be-written.csv"

  # The generated Passport, opened in Chromium. The only job that installs a
  # browser: tests_browser/ sits outside pytest's testpaths and its driver in
  # its own extra, so the matrix stays browser independent.
  browser:
    name: playwright
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,browser]"
      # Chromium only, with the system libraries it needs on the runner.
      - run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: pytest tests_browser -q --browser chromium --tracing retain-on-failure --output test-results
      # A trace holds the console, network and DOM at every step, which is
      # what makes a failure here investigable without reproducing it.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # Passport's authored styles and script. One standalone binary that lints
  # and formats both, so no package.json or node_modules. biome.jsonc scopes it
  # to passport/*.js and *.css, which leaves the vendored bundles alone.
  biome:
    name: biome
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keep `version` in step with the biome-ci hook's `rev` in
      # .pre-commit-config.yaml, so the hook and CI never disagree.
      - uses: biomejs/setup-biome@v2
        with:
          version: 2.5.14
      - run: biome ci .

  # The one check branch protection requires from this workflow, so adding or
  # dropping a Python version, or a job, never touches the ruleset.
  gate:
    name: ci gate
    # Not always(): a run superseded by a newer one is cancelled, and its gate
    # would report a failure on the same commit the newer run is checking.
    if: ${{ !cancelled() }}
    needs: [python, dry-run, browser, biome]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled) echo "::error::a required job finished as $result"; exit 1 ;;
            esac
          done
