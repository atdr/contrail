name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Dry-run against the fixture feed
        # Catches a broken parser here, before it can reach anyone's production
        # instance through a version tag. Needs no secrets: --dry-run never calls
        # the emissions API, and the importer accepts a local path.
        env:
          TRIPIT_ICAL_URL: tests/fixtures/sample_feed.ics
        run: contrail sync --dry-run --csv-path "${RUNNER_TEMP}/should-not-be-written.csv"
