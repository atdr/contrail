name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    # Ten minutes against a job that takes ten seconds. The point is a `pip`
    # fetch that stalls rather than fails, which would otherwise sit until
    # GitHub's six-hour default.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    # Interpolated, not a fixed string: a matrix job with a static `name:`
    # produces three checks called the same thing, and the version under test
    # is the only thing that tells them apart.
    name: pytest ${{ matrix.python-version }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Dry-run against the fixture sources
        # Catches a broken parser here, before it can reach anyone's production
        # instance through a version tag. Both importers, since they also have to
        # agree with each other about which flights are the same one. Needs no
        # secrets: --dry-run never calls the emissions API, and both importers
        # accept a local path.
        env:
          TRIPIT_ICAL_URL: tests/fixtures/sample_feed.ics
          FLIGHTY_CSV_PATH: tests/fixtures/sample_flighty.csv
        run: contrail sync --dry-run --csv-path "${RUNNER_TEMP}/should-not-be-written.csv"

  # Reporting, not a gate: the pytest matrix above is what proves the suite
  # passes, and this job re-runs it under coverage only to produce a report.
  # One interpreter, because coverage of the same code on three of them says
  # the same thing three times. What gets measured lives in pyproject.toml
  # rather than on the command line here, so a developer running pytest --cov
  # locally measures what CI measures.
  coverage:
    name: coverage
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run tests under coverage
        run: pytest -q --cov --cov-report=xml
      # Advisory only: a Codecov outage, or a token missing from a fork, says
      # nothing about the change under review. The coverage run itself stays
      # blocking, on the same reasoning as the timeouts above — a step that can
      # never fail is a check that proves nothing.
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: markdown
    # Ten minutes against a job that takes seconds. The point is a `pip` fetch
    # that stalls rather than fails, which would otherwise sit until GitHub's
    # six-hour default.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A JavaScript action, so GitHub runs it on the runner's own Node: no
      # toolchain to install, nothing fetched from a registry, and the
      # github-actions dependabot ecosystem already configured for this repo
      # keeps the pin current. That is why there is no setup-node step here.
      - uses: DavidAnson/markdownlint-cli2-action@v24
      # 3.13 rather than the 3.12 the other jobs use, and not an oversight:
      # .mdformat.toml sets `exclude`, which errors below 3.13. It says why.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # mdformat's pin lives in pyproject.toml's dev extra, where the pip
      # dependabot ecosystem bumps it. Prettier's had to be a hand edit in this
      # file, because it has no first-party action and `npx` fetched it fresh
      # on every run — a fetch that sat silent for exactly 301 seconds often
      # enough to dominate a job that otherwise takes twelve.
      - run: pip install -e ".[dev]"
      # No filter: .mdformat.toml's `exclude` covers CHANGELOG.md and the rest.
      - run: mdformat --check .
