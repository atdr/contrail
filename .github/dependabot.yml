version: 2
updates:
  # A runtime dependency bump changes what users install, so it has to reach the
  # changelog and cut a release: `fix` is shown by release-please, `chore` is
  # hidden by default and would ship the change invisibly. Dev dependencies
  # affect nobody downstream, so they stay `chore`.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      # The floor here means "any version that carries tz data", true for years.
      # Raising it buys nothing — the constraint is `>=`, so a fresh install
      # already resolves to the newest release the interpreter allows — while
      # costing a patch release and a changelog line every month this data
      # package ships. It would also break the 3.10 CI job the moment the floor
      # passed 20260803, which requires Python 3.11.
      - dependency-name: airportsdata

  # CI only — nothing here reaches an installed contrail, so it stays hidden.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
