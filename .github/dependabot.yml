version: 2
updates:
  # Conventional-commit prefixes so Dependabot's PRs are parsed by release-please
  # rather than silently dropped from the changelog.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
