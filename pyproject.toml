[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contrails"
version = "0.5.1"
description = "Estimate the CO2e emissions of flights you've taken or booked, and keep a running log."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Andreas Richardson" }]
keywords = ["emissions", "co2", "flights", "travel", "tripit", "sustainability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.34.2",
    "icalendar>=7.3.0",
    # IATA -> IANA timezone mapping, so a UTC departure time resolves to the
    # local calendar date TIM asks for. MIT, no dependencies, data bundled in
    # the wheel, so no network call and CI stays hermetic.
    "airportsdata>=20260902",
    # zoneinfo has no system tz database to read on Windows.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0.3"]
dev = [
    "pytest>=9.1.1",
    # Coverage, reported to Codecov by the `coverage` job in ci.yml. What gets
    # measured is configured under `[tool.coverage.run]` at the foot of this
    # file rather than on the command line, so a local run and a CI run measure
    # the same thing.
    "pytest-cov>=7.1.0",
    # Upper bound deliberate: CI gates on `ruff format --check`, and the
    # formatter's output is not stable across minor releases. Without it the
    # first restyling release turns every unrelated PR red. Bumping past it
    # should be a deliberate PR that reformats the tree.
    "ruff>=0.16.5,<0.17",
    # Runs the hooks in .pre-commit-config.yaml, which include the two Markdown
    # tools. Optional to use — CI is still the gate — but declared here so
    # `pip install -e ".[dev]"` leaves nothing to install by hand.
    "pre-commit>=4.6.2",
    # Formats Markdown; markdownlint-cli2 checks what it cannot express. Both
    # `docs` in ci.yml and the pre-commit hook run 3.13, because .mdformat.toml
    # sets `exclude` and that key errors below it — see the comment there.
    #
    # Never add an mdformat *codeformatter* plugin (mdformat-black and the
    # like). mdformat enables every installed one by default, which would
    # reformat the code inside fences — worked examples and commands people
    # paste, not source to tidy. Prettier needed embeddedLanguageFormatting
    # off for the same reason.
    "mdformat>=1.0.0",
    # Tables. Core CommonMark has none, so without this every padded table is
    # reflowed into unpadded pipes.
    "mdformat-gfm>=1.0.0",
    # YAML frontmatter. mdformat does not recognise it otherwise and rewrites
    # the block into a horizontal rule and a heading — it did exactly that to a
    # skill file in contrail-gh. Nothing tracked here carries frontmatter
    # today, which is why this is a guard rather than a fix: the failure is
    # silent, and the first .md that needs it would not announce itself.
    "mdformat-frontmatter>=2.1.2",
    # Self-reference rather than repeating the pyyaml floor: declared once, so
    # the two can't drift, and Dependabot sees pyyaml for what it is — a runtime
    # dependency of the `yaml` extra, not a dev tool.
    "contrails[yaml]",
]

[project.urls]
Homepage = "https://github.com/atdr/contrail"
Issues = "https://github.com/atdr/contrail/issues"
Template = "https://github.com/atdr/contrail-gh"

[project.scripts]
contrail = "contrail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contrail"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Scoped to what ships, not to whatever the tests happened to import. Naming a
# source directory rather than passing `--cov=` paths does two things: files
# under `tests/` stay out of the report, and a module no test imports at all is
# reported at 0% rather than being absent from the report entirely. That is the
# difference between a gap you can see and one you cannot.
source = ["src/contrail"]
branch = true

[tool.coverage.report]
exclude_also = [
    # The protocol method bodies at the three seams. They exist to be
    # overridden, never called, so counting them missed would be permanent.
    "^\\s*\\.\\.\\.$",
]
