[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contrail"
version = "0.3.0"
description = "Estimate the CO2e emissions of flights you've taken or booked, and keep a running log."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Andreas Richardson" }]
keywords = ["emissions", "co2", "flights", "travel", "tripit", "sustainability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.34.2",
    "icalendar>=7.3.0",
    # IATA -> IANA timezone mapping, so a UTC departure time resolves to the
    # local calendar date TIM asks for. MIT, no dependencies, data bundled in
    # the wheel, so no network call and CI stays hermetic.
    "airportsdata>=20260803",
    # zoneinfo has no system tz database to read on Windows.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0.3"]
dev = [
    "pytest>=9.1.1",
    # Upper bound deliberate: CI gates on `ruff format --check`, and the
    # formatter's output is not stable across minor releases. Without it the
    # first restyling release turns every unrelated PR red. Bumping past it
    # should be a deliberate PR that reformats the tree.
    "ruff>=0.16.3,<0.17",
    # Runs the hooks in .pre-commit-config.yaml, which include the two Markdown
    # tools. Optional to use — CI is still the gate — but declared here so
    # `pip install -e ".[dev]"` leaves nothing to install by hand.
    "pre-commit>=4.6.2",
    # Self-reference rather than repeating the pyyaml floor: declared once, so
    # the two can't drift, and Dependabot sees pyyaml for what it is — a runtime
    # dependency of the `yaml` extra, not a dev tool.
    "contrail[yaml]",
]

[project.urls]
Homepage = "https://github.com/atdr/contrail"
Issues = "https://github.com/atdr/contrail/issues"
Template = "https://github.com/atdr/contrail-gh"

[project.scripts]
contrail = "contrail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contrail"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
