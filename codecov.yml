# Codecov's two statuses are allowed to fail. A status that is informational
# can never go red, so it says nothing about the change under review; this repo
# follows atdr/github-boilerplate's template/python/codecov.yml on that point.
# The threshold keeps one untested line at high coverage from turning the
# project status red.
coverage:
  status:
    project:
      default:
        threshold: 0.1%
    patch:
      default: {}

# The report measures the shipped package, so there is nothing else to ignore
# here; `[tool.coverage.run] source` in pyproject.toml is what sets the scope,
# and it is the same scope a local run measures.
comment:
  layout: "condensed_header, diff, files"
  require_changes: true
